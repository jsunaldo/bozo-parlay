<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd23f"/><stop offset="1" stop-color="#ff6a1a"/>
    </linearGradient>
    <radialGradient id="glow" cx=".3" cy=".15" r=".8">
      <stop offset="0" stop-color="#fff" stop-opacity=".28"/><stop offset=".6" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nose" cx=".35" cy=".3" r=".8">
      <stop offset="0" stop-color="#ff7b86"/><stop offset=".55" stop-color="#ff3b4a"/><stop offset="1" stop-color="#c8202e"/>
    </radialGradient>
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffaf0"/><stop offset="1" stop-color="#f6e7d2"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="114" fill="url(#bg)"/>
  <rect width="512" height="512" rx="114" fill="url(#glow)"/>

  <!-- soft shadow -->
  <ellipse cx="256" cy="300" rx="176" ry="160" fill="#000" opacity=".18"/>

  <!-- wing hair (behind face) -->
  <g fill="#2f8cff">
    <circle cx="112" cy="232" r="62"/><circle cx="92" cy="300" r="50"/><circle cx="128" cy="342" r="42"/>
    <circle cx="400" cy="232" r="62"/><circle cx="420" cy="300" r="50"/><circle cx="384" cy="342" r="42"/>
  </g>
  <g fill="#5fb0ff">
    <circle cx="98" cy="214" r="22"/><circle cx="414" cy="214" r="22"/>
  </g>

  <!-- face -->
  <ellipse cx="256" cy="286" rx="150" ry="156" fill="url(#face)"/>

  <!-- cheeks -->
  <circle cx="166" cy="330" r="24" fill="#ff8fb8" opacity=".75"/>
  <circle cx="346" cy="330" r="24" fill="#ff8fb8" opacity=".75"/>

  <!-- brows -->
  <path d="M170 214 q34 -38 74 -6" fill="none" stroke="#1b2432" stroke-width="16" stroke-linecap="round"/>
  <path d="M342 214 q-34 -38 -74 -6" fill="none" stroke="#1b2432" stroke-width="16" stroke-linecap="round"/>

  <!-- eyes -->
  <ellipse cx="206" cy="262" rx="17" ry="22" fill="#1b2432"/>
  <ellipse cx="306" cy="262" rx="17" ry="22" fill="#1b2432"/>
  <circle cx="212" cy="253" r="6" fill="#fff"/><circle cx="312" cy="253" r="6" fill="#fff"/>

  <!-- mouth: red lip band with white grin -->
  <path d="M164 336 Q256 458 348 336 Q256 386 164 336 Z" fill="#e0242f"/>
  <path d="M188 348 Q256 418 324 348 Q256 372 188 348 Z" fill="#fff"/>

  <!-- nose -->
  <circle cx="256" cy="306" r="40" fill="url(#nose)"/>
  <ellipse cx="242" cy="292" rx="12" ry="8" fill="#fff" opacity=".75" transform="rotate(-25 242 292)"/>


  <!-- graduation cap: Bozo University -->
  <g transform="rotate(-7 256 110)">
    <path d="M170 104 L170 156 Q256 196 342 156 L342 104 Z" fill="#141b26"/>
    <path d="M256 40 L424 104 L256 168 L88 104 Z" fill="#232f42"/>
    <path d="M256 40 L424 104 L256 118 L88 104 Z" fill="#fff" opacity=".08"/>
    <circle cx="256" cy="104" r="11" fill="#c8102e"/>
    <path d="M256 104 Q334 106 396 124 L400 196" fill="none" stroke="#c8102e" stroke-width="9" stroke-linecap="round"/>
    <path d="M388 192 L412 192 L418 244 Q400 252 382 244 Z" fill="#c8102e"/>
  </g>

  <!-- bow tie -->
  <g transform="translate(256 470)">
    <path d="M-8 0 L-74 -30 Q-88 0 -74 30 Z" fill="#22e07a"/>
    <path d="M8 0 L74 -30 Q88 0 74 30 Z" fill="#22e07a"/>
    <path d="M-8 0 L-74 -30 Q-88 0 -74 30 Z" fill="#000" opacity=".12" transform="scale(.7 .55)"/>
    <path d="M8 0 L74 -30 Q88 0 74 30 Z" fill="#000" opacity=".12" transform="scale(.7 .55)"/>
    <rect x="-14" y="-16" width="28" height="32" rx="8" fill="#12b85e"/>
  </g>
</svg>
